[workspace]
resolver = "2"
members = ["crates/zhuye-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
authors = ["宋新亮 <songxinliang@hungrystudio.com>"]
repository = "https://github.com/Asketisch/Reflect-TUI"
homepage = "https://github.com/Asketisch/Reflect-TUI"

# ── 核心依赖:从 zhuye-agent submodule 通过 path 引用 ──
# 注意:Cargo 不支持嵌套 workspace,这里只用 path 依赖,不把核心 crate 列入 members。
# 核心 crate 仍属于 zhuye-agent 自己的 workspace,通过 path 被本仓库消费。
# ── workspace 统一 lint 配置 ──────────────────────────────
# 镜像 zhuye-agent 根 Cargo.toml 的 [workspace.lints]:核心 crate 自 v0.1.9 起
# 通过 `[lints] workspace = true` 继承,跨 workspace 解析落到本根清单,
# 不定义则 manifest 加载直接报错。
[workspace.lints.clippy]
all = "deny"
redundant_clone  = "deny"
needless_collect = "deny"
map_unwrap_or    = "deny"
# M1 宽松清单(priority 高于 all,数值更大者优先)。
derivable_impls    = { level = "allow", priority = 10 }
needless_lifetimes = { level = "allow", priority = 10 }
collapsible_if     = { level = "allow", priority = 10 }
io_other_error     = { level = "allow", priority = 10 }
collapsible_match  = { level = "allow", priority = 10 }
needless_borrow    = { level = "allow", priority = 10 }
redundant_closure  = { level = "allow", priority = 10 }
or_fun_call        = { level = "allow", priority = 10 }
option_if_let_else = { level = "allow", priority = 10 }
nonminimal_bool    = { level = "allow", priority = 10 }
manual_div_ceil    = { level = "allow", priority = 10 }

[workspace.dependencies]
# protocol 层
zhuye-protocol = { path = "zhuye-agent/crates/protocol/zhuye-protocol" }

# abilities 层
zhuye-llm        = { path = "zhuye-agent/crates/abilities/zhuye-llm" }
zhuye-tools      = { path = "zhuye-agent/crates/abilities/zhuye-tools" }
zhuye-hooks      = { path = "zhuye-agent/crates/abilities/zhuye-hooks" }
zhuye-skills     = { path = "zhuye-agent/crates/abilities/zhuye-skills" }
zhuye-bm25       = { path = "zhuye-agent/crates/abilities/zhuye-bm25" }
zhuye-memory     = { path = "zhuye-agent/crates/abilities/zhuye-memory" }
zhuye-agent-def  = { path = "zhuye-agent/crates/abilities/zhuye-agent-def" }
zhuye-prompt     = { path = "zhuye-agent/crates/abilities/zhuye-prompt" }
zhuye-compact    = { path = "zhuye-agent/crates/abilities/zhuye-compact" }
zhuye-recovery   = { path = "zhuye-agent/crates/abilities/zhuye-recovery" }
zhuye-notes      = { path = "zhuye-agent/crates/abilities/zhuye-notes" }
zhuye-sanitize   = { path = "zhuye-agent/crates/abilities/zhuye-sanitize" }
zhuye-kms        = { path = "zhuye-agent/crates/abilities/zhuye-kms" }

# resources 层
zhuye-config      = { path = "zhuye-agent/crates/resources/zhuye-config" }
zhuye-permissions = { path = "zhuye-agent/crates/resources/zhuye-permissions" }
zhuye-plugin      = { path = "zhuye-agent/crates/resources/zhuye-plugin" }
zhuye-rollout     = { path = "zhuye-agent/crates/resources/zhuye-rollout" }
zhuye-telemetry   = { path = "zhuye-agent/crates/resources/zhuye-telemetry" }
zhuye-sandbox     = { path = "zhuye-agent/crates/resources/zhuye-sandbox" }
zhuye-ast         = { path = "zhuye-agent/crates/resources/zhuye-ast" }
zhuye-audit       = { path = "zhuye-agent/crates/resources/zhuye-audit" }
zhuye-secrets     = { path = "zhuye-agent/crates/resources/zhuye-secrets" }
zhuye-fs          = { path = "zhuye-agent/crates/resources/zhuye-fs" }
zhuye-git         = { path = "zhuye-agent/crates/resources/zhuye-git" }
zhuye-wasm        = { path = "zhuye-agent/crates/resources/zhuye-wasm" }

# integrations 层
zhuye-mcp         = { path = "zhuye-agent/crates/integrations/zhuye-mcp" }
zhuye-lsp         = { path = "zhuye-agent/crates/integrations/zhuye-lsp" }
zhuye-stream      = { path = "zhuye-agent/crates/integrations/zhuye-stream" }
zhuye-integration = { path = "zhuye-agent/crates/integrations/zhuye-integration" }

# orchestration 层
# 注:zhuye-goal 是 zhuye-core 的传递依赖(core Cargo.toml 引用),必须声明;
# zhuye-task/subagent 被 TUI 直接依赖。v1.x 起 submodule 的 facade/CLI crate
# (zhuye/zhuye-exec)以 workspace 继承方式引用 discussion/pipeline,
# 因此镜像必须列全,否则外层解析继承时缺表报错。
zhuye-task        = { path = "zhuye-agent/crates/orchestration/zhuye-task" }
zhuye-subagent    = { path = "zhuye-agent/crates/orchestration/zhuye-subagent" }
zhuye-goal        = { path = "zhuye-agent/crates/orchestration/zhuye-goal" }
zhuye-discussion  = { path = "zhuye-agent/crates/orchestration/zhuye-discussion" }
zhuye-pipeline    = { path = "zhuye-agent/crates/orchestration/zhuye-pipeline" }

# runtime 层(核心引擎)
zhuye-core = { path = "zhuye-agent/crates/runtime/zhuye-core" }
zhuye      = { path = "zhuye-agent/crates/runtime/zhuye" }
zhuye-exec = { path = "zhuye-agent/crates/runtime/zhuye-exec" }

# ── 通用外部依赖(与核心 workspace 对齐版本)──
tokio              = { version = "1", features = ["full"] }
tokio-util         = "0.7"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
serde_yaml         = "0.9"
toml               = "0.8"
async-trait        = "0.1"
anyhow             = "1"
thiserror          = "1"
clap               = { version = "4", features = ["derive"] }
pollster           = "0.4"
reqwest            = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
futures            = "0.3"
rmcp               = { version = "=3.10.0", features = [
    "client",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
] }
lsp-types         = { version = "=0.97", default-features = false }
globset           = "0.4"
url               = "2"
schemars = "0.8"
uuid     = { version = "1", features = ["v4", "v7", "serde"] }
eventsource-stream = "0.2"
ignore  = "0.4"
similar = "2"
regex   = "1"
rankfns = "0.1"
htmd        = "0.5"
tiktoken-rs = "0.12"
once_cell   = "1"
minijinja = "2"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
filetime    = "0.2"
sha2     = "0.10"
wasmtime     = { version = "=36.0.20", default-features = false, features = [
    "async",
    "cranelift",
    "component-model",
    "runtime",
] }
wasmtime-wasi = { version = "=36.0.20", default-features = false }
proptest = "1"
opentelemetry         = "0.27"
opentelemetry_sdk     = { version = "0.27", features = ["rt-tokio"] }
opentelemetry-otlp    = { version = "0.27", features = ["http-proto", "reqwest-client", "trace"] }
tracing-opentelemetry = "0.28"
wiremock = "0.6"
insta    = { version = "1", features = ["yaml"] }

# ── TUI 专属外部依赖 ──
ratatui   = "0.29"
crossterm = "0.28"
color-eyre = "0.6"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Fast development profile: no LTO, high parallelism.
[profile.release-fast]
inherits = "release"
lto = false
codegen-units = 16
opt-level = 2
incremental = true

[profile.dev]
incremental = false

[profile.test]
debug = 1
codegen-units = 256

# TUI 专属 patch —— nornagon fork 暴露 ratatui/crossterm 的 unstable features
# (WidgetRef / rendered-line-info / scrolling-regions / backend-writer),
# 被 custom_terminal.rs / insert_history.rs 深度使用。
# 从 Reflect-Agent 根 Cargo.toml 迁移而来(TUI 是唯一消费者)。
[patch.crates-io]
crossterm = { git = "https://github.com/nornagon/crossterm", rev = "87db8bfa6dc99427fd3b071681b07fc31c6ce995" }
ratatui = { git = "https://github.com/nornagon/ratatui", rev = "9b2ad1298408c45918ee9f8241a6f95498cdbed2" }
