# ZhuYe-CLI 跨平台发布构建。
#
# 仅由 `git push --tags v*` 或 Actions 手动触发。在三个 OS 上并行构建
# 各平台原生分发包(macOS/Linux tar.gz / Windows zip),上传到 workflow
# run,tag 触发时聚合到 GitHub Release。
#
# 注意:本仓库通过 `zhuye-agent/` submodule 引用核心 crate,CI 必须
# 递归 checkout submodule 才能编译。
#
# 本地一次性构建无需此 workflow —— 直接 `./scripts/build.sh --dist`。

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:    # Actions 标签页手动触发

permissions:
  contents: write       # softprops/action-gh-release 上传资产所需

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 / macos-13 镜像已退役(macos-13 的 job 会无限排队,
          # macos-14 报「configuration not supported」)。按官方镜像表用
          # 显式标签:arm64 = macos-15;x64(Intel)= macos-15-intel,
          # 避免 -latest 迁移期漂移。
          - os: macos-arm64
            runner: macos-15
          - os: macos-x86_64
            runner: macos-15-intel
          - os: linux
            runner: ubuntu-22.04
          - os: windows
            runner: windows-latest

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build + package
        shell: bash
        run: ./scripts/build.sh --dist

      - name: Audit package before upload
        shell: bash
        run: |
          set -euo pipefail
          artifact="$(find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)"
          python tests/release.py "$artifact"

      - name: Locate artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find dist -type f \( \
            -name '*.tar.gz' -o \
            -name '*.zip' \) -print -exec cp {} artifacts/ \;
          echo "staged artifacts:"
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhuye-cli-${{ matrix.os }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List downloaded
        run: ls -la release-assets/

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
